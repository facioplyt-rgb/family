<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodzinne Centrum Dowodzenia</title>
    <!-- Ładowanie stylów Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">
    
    <!-- ========================================== -->
    <!-- EKRAN 1: LOGOWANIE / REJESTRACJA           -->
    <!-- ========================================== -->
    <div id="auth-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <div class="text-center mb-6">
                <div class="text-5xl mb-3">🏠</div>
                <h1 class="text-2xl font-bold">Centrum Rodzinne</h1>
                <p class="text-slate-500 text-sm mt-1">Zaloguj się, utwórz grupę lub dołącz</p>
            </div>

            <div class="space-y-5">
                <!-- Podanie imienia (wymagane do wszystkiego) -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">TWOJE IMIĘ</label>
                    <input type="text" id="userNameInput" class="w-full bg-slate-50 border border-slate-200 rounded p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="np. Fabian">
                </div>
                
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span class="flex-shrink-0 mx-4 text-slate-400 text-xs">UTWÓRZ NOWĄ</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>

                <!-- Opcja A: Tworzenie -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">NAZWA RODZINY</label>
                    <div class="flex gap-2">
                        <input type="text" id="familyNameInput" class="w-full bg-slate-50 border border-slate-200 rounded p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="np. Żukowscy">
                        <button id="createFamilyBtn" class="bg-indigo-600 text-white font-bold py-2.5 px-5 rounded hover:bg-indigo-700 transition-colors whitespace-nowrap shadow-md">Stwórz</button>
                    </div>
                </div>
                
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span class="flex-shrink-0 mx-4 text-slate-400 text-xs">LUB DOŁĄCZ</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>

                <!-- Opcja B: Dołączanie -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">KOD ZAPROSZENIA</label>
                    <div class="flex gap-2">
                        <input type="text" id="joinFamilyInput" class="w-full bg-slate-50 border border-slate-200 rounded p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Wklej kod...">
                        <button id="joinFamilyBtn" class="bg-slate-200 text-slate-700 font-bold py-2.5 px-5 rounded hover:bg-slate-300 transition-colors whitespace-nowrap shadow-sm">Dołącz</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- EKRAN 2: GŁÓWNY PANEL (Po zalogowaniu)     -->
    <!-- ========================================== -->
    <div id="dashboard-screen" class="hidden min-h-screen flex-col">
        <!-- Pasek górny -->
        <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🏠</span>
                <h1 class="font-bold text-lg" id="dashboardFamilyName">Ładowanie...</h1>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm bg-indigo-700 px-3 py-1 rounded-full" id="dashboardUserName">Witaj!</span>
                <button id="logoutBtn" class="text-sm bg-white text-indigo-600 font-bold px-3 py-1 rounded hover:bg-slate-100 transition-colors">Wyloguj</button>
            </div>
        </header>

        <!-- Główna zawartość -->
        <main class="p-6 max-w-4xl mx-auto w-full flex-grow">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold mb-4">Kod Twojej rodziny</h2>
                <p class="text-sm text-slate-600 mb-2">Przekaż ten kod innym domownikom, aby mogli dołączyć do panelu:</p>
                <div class="bg-slate-100 p-3 rounded border border-slate-200 font-mono text-lg font-bold text-center tracking-widest text-indigo-700 select-all" id="displayFamilyCode">
                    BRAK KODU
                </div>
            </div>
            
            <!-- Tutaj w przyszłości dodamy kalendarz, listę zadań itp. -->
            <div class="mt-6 text-center text-slate-400">
                <p>Miejsce na moduł zadań i kalendarza...</p>
            </div>
        </main>
    </div>

    <!-- Ładowanie skryptu z logiką Firebase (zawsze używaj type="module") -->
    <script type="module" src="./app.js"></script>
</body>
</html>
