<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodzinne Centrum Dowodzenia</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">
    
    <!-- EKRAN LOGOWANIA -->
    <div id="auth-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <div class="text-center mb-6">
                <div class="text-5xl mb-3">🏠</div>
                <h1 class="text-2xl font-bold">Centrum Rodzinne</h1>
                <p class="text-slate-500 text-sm mt-1">Zaloguj się, utwórz grupę lub dołącz</p>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">TWOJE IMIĘ</label>
                    <input type="text" id="userNameInput" class="w-full bg-slate-50 border border-slate-200 rounded p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="np. Fabian">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">NAZWA NOWEJ RODZINY</label>
                    <div class="flex gap-2">
                        <input type="text" id="familyNameInput" class="w-full bg-slate-50 border border-slate-200 rounded p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="np. Żukowscy">
                        <button id="createFamilyBtn" class="bg-indigo-600 text-white font-bold py-2.5 px-5 rounded hover:bg-indigo-700 whitespace-nowrap">Stwórz</button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">KOD ZAPROSZENIA</label>
                    <div class="flex gap-2">
                        <input type="text" id="joinFamilyInput" class="w-full bg-slate-50 border border-slate-200 rounded p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Wklej kod...">
                        <button id="joinFamilyBtn" class="bg-slate-200 text-slate-700 font-bold py-2.5 px-5 rounded hover:bg-slate-300 whitespace-nowrap">Dołącz</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PANEL GŁÓWNY -->
    <div id="dashboard-screen" class="hidden min-h-screen flex flex-col">
        <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🏠</span>
                <h1 class="font-bold text-lg" id="dashboardFamilyName">Ładowanie...</h1>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm bg-indigo-700 px-3 py-1 rounded-full" id="dashboardUserName">Witaj!</span>
                <button id="logoutBtn" class="text-sm bg-white text-indigo-600 font-bold px-3 py-1 rounded hover:bg-slate-100">Wyloguj</button>
            </div>
        </header>

        <!-- Nawigacja zakładek -->
        <nav class="bg-white border-b border-slate-200 px-6 flex gap-4 overflow-x-auto shadow-sm">
            <button class="tab-btn py-3 px-4 font-bold border-b-2 border-indigo-600 text-indigo-600 text-sm whitespace-nowrap" data-target="tab-home">Strona Główna</button>
            <button class="tab-btn py-3 px-4 font-bold text-slate-500 hover:text-indigo-600 text-sm whitespace-nowrap" data-target="tab-chores">Obowiązki</button>
            <button class="tab-btn py-3 px-4 font-bold text-slate-500 hover:text-indigo-600 text-sm whitespace-nowrap" data-target="tab-calendar">Kalendarz / Rezerwacje</button>
            <button class="tab-btn py-3 px-4 font-bold text-slate-500 hover:text-indigo-600 text-sm whitespace-nowrap" data-target="tab-announcements">Ogłoszenia</button>
            <button class="tab-btn py-3 px-4 font-bold text-slate-500 hover:text-indigo-600 text-sm whitespace-nowrap" data-target="tab-settings">Zarządzanie</button>
        </nav>

        <!-- Zawartość zakładek -->
        <main class="p-6 max-w-5xl mx-auto w-full flex-grow">
            
            <!-- ZAKŁADKA 1: START -->
            <div id="tab-home" class="tab-content space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-xl font-bold mb-2">Kod Twojej rodziny</h2>
                    <p class="text-sm text-slate-600 mb-2">Przekaż ten kod innym domownikom, aby mogli dołączyć:</p>
                    <div class="bg-slate-100 p-3 rounded border border-slate-200 font-mono text-lg font-bold text-center tracking-widest text-indigo-700 select-all" id="displayFamilyCode">---</div>
                </div>
            </div>

            <!-- ZAKŁADKA 2: OBOWIĄZKI -->
            <div id="tab-chores" class="tab-content hidden space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-xl font-bold mb-4">Lista Obowiązków domowych</h2>
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="choreTitle" placeholder="Co trzeba zrobić? (np. Wynieść śmieci)" class="w-full bg-slate-50 border border-slate-200 rounded p-2">
                        <input type="text" id="choreAssignee" placeholder="Dla kogo?" class="w-48 bg-slate-50 border border-slate-200 rounded p-2">
                        <button id="addChoreBtn" class="bg-indigo-600 text-white font-bold px-4 py-2 rounded hover:bg-indigo-700 whitespace-nowrap">Dodaj</button>
                    </div>
                    <div id="choresList" class="space-y-2"><!-- Tutaj wpadną zadania --></div>
                </div>
            </div>

            <!-- ZAKŁADKA 3: KALENDARZ -->
            <div id="tab-calendar" class="tab-content hidden space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-xl font-bold mb-4">Kalendarz i Rezerwacje (np. Pralka, Samochód)</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-4">
                        <input type="text" id="eventTitle" placeholder="Co rezerwujesz? (np. Pralka)" class="bg-slate-50 border border-slate-200 rounded p-2">
                        <input type="datetime-local" id="eventDate" class="bg-slate-50 border border-slate-200 rounded p-2">
                        <button id="addEventBtn" class="bg-indigo-600 text-white font-bold px-4 py-2 rounded hover:bg-indigo-700">Zarezerwuj / Zaplanuj</button>
                    </div>
                    <div id="eventsList" class="space-y-2"><!-- Tutaj wpadną rezerwacje --></div>
                </div>
            </div>

            <!-- ZAKŁADKA 4: OGŁOSZENIA -->
            <div id="tab-announcements" class="tab-content hidden space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-xl font-bold mb-4">Tablica Ogłoszeń</h2>
                    <textarea id="announcementText" placeholder="Napisz coś ważnego dla rodziny..." class="w-full bg-slate-50 border border-slate-200 rounded p-2 mb-2 h-24"></textarea>
                    <button id="addAnnouncementBtn" class="bg-indigo-600 text-white font-bold px-4 py-2 rounded hover:bg-indigo-700">Opublikuj ogłoszenie</button>
                    <div id="announcementsList" class="mt-6 space-y-3"><!-- Tutaj wpadną ogłoszenia --></div>
                </div>
            </div>

            <!-- ZAKŁADKA 5: ZARZĄDZANIE -->
            <div id="tab-settings" class="tab-content hidden space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-xl font-bold mb-4">Członkowie rodziny i Role</h2>
                    <div id="membersList" class="space-y-2"><!-- Lista domowników --></div>
                </div>
            </div>

        </main>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
