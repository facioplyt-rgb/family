<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodzinne Centrum Dowodzenia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Drobne poprawki paska przewijania dla czatu */
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-[#f3f2f1] min-h-screen text-gray-800 font-sans">
    
    <!-- ========================================== -->
    <!-- EKRAN LOGOWANIA -->
    <!-- ========================================== -->
    <div id="auth-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-10 shadow-md w-full max-w-md border border-gray-200">
            <div class="mb-8">
                <h1 class="text-2xl font-semibold text-gray-900">Centrum Rodzinne</h1>
                <p class="text-gray-500 text-sm mt-1">Zaloguj się do swojego obszaru roboczego</p>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm text-gray-700 mb-1">Twoje imię</label>
                    <input type="text" id="userNameInput" class="w-full border border-gray-400 rounded-sm p-2 focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none transition-all" placeholder="np. Fabian">
                </div>
                
                <div class="border-t border-gray-200 pt-4">
                    <label class="block text-sm text-gray-700 mb-1">Utwórz nową grupę</label>
                    <div class="flex gap-2">
                        <input type="text" id="familyNameInput" class="w-full border border-gray-400 rounded-sm p-2 focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none" placeholder="Nazwa rodziny">
                        <button id="createFamilyBtn" class="bg-[#0078d4] text-white text-sm font-semibold py-2 px-5 rounded-sm hover:bg-[#106ebe] transition-colors whitespace-nowrap">Utwórz</button>
                    </div>
                </div>
                
                <div class="border-t border-gray-200 pt-4">
                    <label class="block text-sm text-gray-700 mb-1">Dołącz do istniejącej</label>
                    <div class="flex gap-2">
                        <input type="text" id="joinFamilyInput" class="w-full border border-gray-400 rounded-sm p-2 focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none" placeholder="Kod zaproszenia">
                        <button id="joinFamilyBtn" class="bg-gray-200 text-gray-800 text-sm font-semibold py-2 px-5 rounded-sm hover:bg-gray-300 transition-colors whitespace-nowrap">Dołącz</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- PANEL GŁÓWNY -->
    <!-- ========================================== -->
    <div id="dashboard-screen" class="hidden min-h-screen flex-col">
        <!-- Pasek nawigacji górnej -->
        <header class="bg-[#0078d4] text-white px-4 py-3 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-4">
                <div class="bg-white/20 p-1.5 rounded-sm">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                </div>
                <h1 class="font-semibold text-lg" id="dashboardFamilyName">Ładowanie obszaru...</h1>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <span id="dashboardUserName" class="hidden sm:inline-block">Witaj!</span>
                <button id="logoutBtn" class="text-white hover:underline text-sm">Wyloguj</button>
            </div>
        </header>

        <!-- Menu zakładek -->
        <nav class="bg-white border-b border-gray-200 px-4 flex gap-1 overflow-x-auto">
            <button class="tab-btn px-4 py-3 text-sm font-semibold border-b-2 border-[#0078d4] text-[#0078d4] whitespace-nowrap" data-target="tab-home">Start</button>
            <button class="tab-btn px-4 py-3 text-sm font-semibold text-gray-600 hover:text-gray-900 border-b-2 border-transparent whitespace-nowrap" data-target="tab-chores">Obowiązki</button>
            <button class="tab-btn px-4 py-3 text-sm font-semibold text-gray-600 hover:text-gray-900 border-b-2 border-transparent whitespace-nowrap" data-target="tab-chat">Czat Rodzinny</button>
            <button class="tab-btn px-4 py-3 text-sm font-semibold text-gray-600 hover:text-gray-900 border-b-2 border-transparent whitespace-nowrap relative" data-target="tab-reminders">
                Przypomnienia
                <span id="reminderBadge" class="hidden absolute top-2 right-1 bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">!</span>
            </button>
            <button class="tab-btn px-4 py-3 text-sm font-semibold text-gray-600 hover:text-gray-900 border-b-2 border-transparent whitespace-nowrap" data-target="tab-announcements">Ogłoszenia</button>
        </nav>

        <!-- Główna zawartość -->
        <main class="p-6 max-w-5xl mx-auto w-full flex-grow">
            
            <!-- ZAKŁADKA 1: START -->
            <div id="tab-home" class="tab-content space-y-6">
                <div class="bg-white p-6 shadow-sm border border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-900 mb-1">Identyfikator przestrzeni roboczej</h2>
                    <p class="text-sm text-gray-600 mb-4">Przekaż ten kod innym domownikom, aby mogli dołączyć do grupy.</p>
                    <div class="bg-gray-50 p-3 border border-gray-200 font-mono text-lg text-center tracking-wider text-gray-800 select-all" id="displayFamilyCode">---</div>
                </div>
            </div>

            <!-- ZAKŁADKA 2: OBOWIĄZKI -->
            <div id="tab-chores" class="tab-content hidden space-y-4">
                <div class="bg-white p-6 shadow-sm border border-gray-200">
                    <h2 class="text-lg font-semibold mb-4 text-gray-900">Zadania do wykonania</h2>
                    <div class="flex gap-2 mb-6">
                        <input type="text" id="choreTitle" placeholder="Treść zadania (np. Zakupy)" class="w-full border border-gray-300 rounded-sm p-2 text-sm focus:border-blue-500 focus:outline-none">
                        <input type="text" id="choreAssignee" placeholder="Przypisz do (opcjonalnie)" class="w-48 border border-gray-300 rounded-sm p-2 text-sm focus:border-blue-500 focus:outline-none">
                        <button id="addChoreBtn" class="bg-[#0078d4] text-white font-semibold text-sm px-4 py-2 rounded-sm hover:bg-[#106ebe]">Dodaj</button>
                    </div>
                    <div id="choresList" class="space-y-2 text-sm"></div>
                </div>
            </div>

            <!-- ZAKŁADKA 3: CZAT (NOWOŚĆ) -->
            <div id="tab-chat" class="tab-content hidden h-[600px] max-h-[70vh]">
                <div class="bg-white shadow-sm border border-gray-200 h-full flex flex-col">
                    <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
                        <h2 class="text-lg font-semibold text-gray-900">Konwersacja grupowa</h2>
                    </div>
                    <!-- Okno wiadomości -->
                    <div id="chatMessages" class="flex-grow p-6 overflow-y-auto space-y-4 scrollbar-thin bg-white">
                        <!-- Wiadomości wpadną tutaj -->
                    </div>
                    <!-- Pole wpisywania -->
                    <div class="p-4 border-t border-gray-200 bg-gray-50 flex gap-2">
                        <input type="text" id="chatInput" placeholder="Napisz wiadomość..." class="w-full border border-gray-300 rounded-sm p-2 text-sm focus:border-blue-500 focus:outline-none">
                        <button id="sendChatBtn" class="bg-[#0078d4] text-white font-semibold text-sm px-6 py-2 rounded-sm hover:bg-[#106ebe]">Wyślij</button>
                    </div>
                </div>
            </div>

            <!-- ZAKŁADKA 4: PRZYPOMNIENIA (NOWOŚĆ) -->
            <div id="tab-reminders" class="tab-content hidden space-y-4">
                <div class="bg-white p-6 shadow-sm border border-gray-200">
                    <h2 class="text-lg font-semibold mb-4 text-gray-900">Powiadomienia i Przypomnienia</h2>
                    <div class="flex flex-col md:flex-row gap-2 mb-6">
                        <input type="text" id="reminderTitle" placeholder="O czym przypomnieć?" class="flex-grow border border-gray-300 rounded-sm p-2 text-sm focus:border-blue-500 focus:outline-none">
                        <input type="date" id="reminderDate" class="border border-gray-300 rounded-sm p-2 text-sm focus:border-blue-500 focus:outline-none">
                        <button id="addReminderBtn" class="bg-[#0078d4] text-white font-semibold text-sm px-4 py-2 rounded-sm hover:bg-[#106ebe]">Ustaw</button>
                    </div>
                    <div id="remindersList" class="space-y-2 text-sm"></div>
                </div>
            </div>

            <!-- ZAKŁADKA 5: OGŁOSZENIA -->
            <div id="tab-announcements" class="tab-content hidden space-y-4">
                <div class="bg-white p-6 shadow-sm border border-gray-200">
                    <h2 class="text-lg font-semibold mb-4 text-gray-900">Ważne Komunikaty</h2>
                    <textarea id="announcementText" placeholder="Treść ogłoszenia..." class="w-full border border-gray-300 rounded-sm p-3 text-sm focus:border-blue-500 focus:outline-none mb-3 h-24 resize-none"></textarea>
                    <button id="addAnnouncementBtn" class="bg-[#0078d4] text-white font-semibold text-sm px-4 py-2 rounded-sm hover:bg-[#106ebe]">Opublikuj</button>
                    <div id="announcementsList" class="mt-8 space-y-4"></div>
                </div>
            </div>

        </main>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
