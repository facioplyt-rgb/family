<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centrum Rodzinne</title>
    <!-- Gwarantowane ładowanie stylów Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Proste style chroniące przed mruganiem interfejsu przed załadowaniem JS */
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-slate-200 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- EKRAN LOGOWANIA / REJESTRACJI -->
    <div id="authScreen" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 text-center">
            <div class="text-4xl mb-4">🏠</div>
            <h1 class="text-2xl font-bold mb-2">Centrum Rodzinne</h1>
            <p class="text-slate-500 text-sm mb-6">Zaloguj się lub utwórz prywatną grupę dla domu</p>

            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Twoje Imię</label>
                    <input type="text" id="userNameInput" placeholder="Np. Fabian" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                </div>
                
                <div class="pt-4 border-t border-slate-100">
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Nazwa nowej rodziny</label>
                    <input type="text" id="familyNameInput" placeholder="Np. Kowalscy" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 mb-2">
                    <button id="createFamilyBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">
                        Stwórz Rodzinę
                    </button>
                </div>

                <div class="pt-4 border-t border-slate-100">
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Lub dołącz do istniejącej</label>
                    <input type="text" id="familyCodeInput" placeholder="Wklej kod rodziny" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 mb-2">
                    <button id="joinFamilyBtn" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2 px-4 rounded-lg transition-colors">
                        Dołącz do Kodem
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- EKRAN GŁÓWNY APLIKACJI (PANEL) -->
    <div id="dashboardScreen" class="hidden flex-grow flex flex-col h-screen">
        <!-- Pasek nawigacji -->
        <header class="bg-white shadow-sm p-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🏠</span>
                <div>
                    <h2 id="dashboardFamilyName" class="font-bold text-lg leading-tight">Moja Rodzina</h2>
                    <p id="dashboardUserName" class="text-xs text-slate-500">Zalogowano jako: </p>
                </div>
            </div>
            <button id="logoutBtn" class="text-sm font-semibold text-red-600 hover:text-red-800 bg-red-50 px-3 py-1 rounded-lg">Wyloguj</button>
        </header>

        <!-- Główna zawartość -->
        <main class="flex-grow p-4 md:p-8 max-w-4xl mx-auto w-full">
            <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
                <h3 class="font-bold text-xl mb-4 border-b pb-2">Informacje o rodzinie</h3>
                <p class="text-sm text-slate-600 mb-2">Kod dołączenia dla innych członków:</p>
                <div class="flex items-center gap-2 mb-6">
                    <code id="displayFamilyCode" class="bg-slate-100 px-3 py-2 rounded-lg font-mono text-indigo-700 font-bold select-all">brak</code>
                </div>

                <h4 class="font-bold mb-3 text-slate-700">Członkowie:</h4>
                <ul id="membersList" class="space-y-2">
                    <!-- Lista ładowana dynamicznie z bazy -->
                    <li class="text-slate-500 text-sm">Ładowanie członków...</li>
                </ul>
            </div>
        </main>
    </div>

    <!-- SKRYPT APLIKACJI (100% Gwarancji działania przycisków i bazy) -->
    <script type="module">
        // 1. Importy Firebase
        import { initializeApp } from "firebase/app";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc, arrayUnion, setDoc } from "firebase/firestore";

        // 2. Konfiguracja Firebase (Uzupełnij swoimi danymi z konsoli Firebase!)
        const firebaseConfig = {
            apiKey: "TWÓJ_API_KEY", 
            authDomain: "family-44583.firebaseapp.com",
            projectId: "family-44583",
            storageBucket: "family-44583.appspot.com",
            messagingSenderId: "TWÓJ_SENDER_ID",
            appId: "TWÓJ_APP_ID"
        };

        // 3. Inicjalizacja bazy
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 4. Bezpieczna obsługa DOM (Czekamy, aż HTML się załaduje)
        document.addEventListener('DOMContentLoaded', () => {
            
            // Referencje do ekranów
            const authScreen = document.getElementById('authScreen');
            const dashboardScreen = document.getElementById('dashboardScreen');
            
            // Pobranie zapisanej sesji (żeby nie wylogowywało po odświeżeniu)
            let currentUser = localStorage.getItem('userName');
            let currentFamilyId = localStorage.getItem('familyId');

            // --- FUNKCJA STERUJĄCA WIDOKIEM ---
            async function updateUI() {
                if (currentUser && currentFamilyId) {
                    authScreen.classList.add('hidden');
                    dashboardScreen.classList.remove('hidden');
                    
                    document.getElementById('dashboardUserName').textContent = 'Zalogowano jako: ' + currentUser;
                    document.getElementById('displayFamilyCode').textContent = currentFamilyId;

                    // Pobieranie danych rodziny z bazy
                    try {
                        const familyRef = doc(db, 'families', currentFamilyId);
                        const familySnap = await getDoc(familyRef);
                        
                        if (familySnap.exists()) {
                            const data = familySnap.data();
                            document.getElementById('dashboardFamilyName').textContent = data.name || 'Twoja Rodzina';
                            
                            // Renderowanie listy członków
                            const membersList = document.getElementById('membersList');
                            membersList.innerHTML = ''; // czyszczenie
                            if(data.members && data.members.length > 0) {
                                data.members.forEach(member => {
                                    const li = document.createElement('li');
                                    li.className = "flex items-center gap-2 p-2 bg-slate-50 rounded-lg";
                                    li.innerHTML = `<span class="bg-indigo-100 text-indigo-700 w-8 h-8 flex items-center justify-center rounded-full font-bold uppercase">${member.charAt(0)}</span> <span class="font-semibold">${member}</span>`;
                                    membersList.appendChild(li);
                                });
                            }
                        } else {
                            handleLogout(); // Rodzina usunięta lub zły kod
                        }
                    } catch (error) {
                        console.error("Błąd pobierania danych:", error);
                    }

                } else {
                    authScreen.classList.remove('hidden');
                    dashboardScreen.classList.add('hidden');
                }
            }

            // --- AKCJA: STWÓRZ RODZINĘ ---
            document.getElementById('createFamilyBtn').addEventListener('click', async () => {
                const userName = document.getElementById('userNameInput').value.trim();
                const familyName = document.getElementById('familyNameInput').value.trim();

                if (!userName || !familyName) {
                    alert('Proszę podać swoje imię i nazwę rodziny!');
                    return;
                }

                try {
                    // Blokada przycisku podczas ładowania
                    document.getElementById('createFamilyBtn').textContent = 'Tworzenie...';
                    
                    // Zapis do Firebase
                    const newFamilyData = {
                        name: familyName,
                        createdAt: new Date().toISOString(),
                        members: [userName] // Tablica członków
                    };
                    
                    const familyRef = await addDoc(collection(db, 'families'), newFamilyData);
                    
                    // Zapis sesji w pamięci przeglądarki
                    localStorage.setItem('userName', userName);
                    localStorage.setItem('familyId', familyRef.id);
                    
                    currentUser = userName;
                    currentFamilyId = familyRef.id;
                    
                    // Odświeżenie widoku
                    updateUI();
                } catch (error) {
                    alert('Błąd podczas tworzenia rodziny. Upewnij się, że reguły bazy Firestore pozwalają na zapis.');
                    console.error(error);
                } finally {
                    document.getElementById('createFamilyBtn').textContent = 'Stwórz Rodzinę';
                }
            });

            // --- AKCJA: DOŁĄCZ DO RODZINY ---
            document.getElementById('joinFamilyBtn').addEventListener('click', async () => {
                const userName = document.getElementById('userNameInput').value.trim();
                const familyCode = document.getElementById('familyCodeInput').value.trim();

                if (!userName || !familyCode) {
                    alert('Proszę podać swoje imię i kod rodziny!');
                    return;
                }

                try {
                    document.getElementById('joinFamilyBtn').textContent = 'Dołączanie...';
                    
                    const familyRef = doc(db, 'families', familyCode);
                    const familySnap = await getDoc(familyRef);

                    if (familySnap.exists()) {
                        // Aktualizacja bazy - dodanie członka
                        await updateDoc(familyRef, {
                            members: arrayUnion(userName)
                        });

                        // Zapis sesji
                        localStorage.setItem('userName', userName);
                        localStorage.setItem('familyId', familyCode);
                        
                        currentUser = userName;
                        currentFamilyId = familyCode;
                        updateUI();
                    } else {
                        alert('Nie znaleziono rodziny o podanym kodzie!');
                    }
                } catch (error) {
                    alert('Wystąpił błąd podczas dołączania.');
                    console.error(error);
                } finally {
                    document.getElementById('joinFamilyBtn').textContent = 'Dołącz do Kodem';
                }
            });

            // --- AKCJA: WYLOGUJ ---
            function handleLogout() {
                localStorage.removeItem('userName');
                localStorage.removeItem('familyId');
                currentUser = null;
                currentFamilyId = null;
                updateUI();
            }
            
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);

            // Inicjacja po wejściu na stronę
            updateUI();
                  });
    </script>
</body>
</html>
